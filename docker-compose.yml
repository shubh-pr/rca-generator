# Local stack (development settings, demo data). Production: docker-compose.prod.yml.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rca
      POSTGRES_PASSWORD: rca
      POSTGRES_DB: rca
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rca -d rca"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Local only: demo data, console email (links are printed in `docker compose logs api`), disk storage.
    command: ["sh", "-c", "node ../../node_modules/prisma/build/index.js migrate deploy && node dist/prisma/seed.js; exec node dist/src/server.js"]
    environment:
      NODE_ENV: development
      SEED_DEMO: "true"
      DATABASE_URL: postgresql://rca:rca@db:5432/rca
      JWT_SECRET: ${JWT_SECRET:-change-me-local-docker-secret-000000000}
      APP_URL: http://localhost:${WEB_PORT:-8080}
      TRUST_PROXY: "1"
      EMAIL_PROVIDER: console
      STORAGE_DRIVER: local
      UPLOAD_DIR: /data/uploads
      PDF_CHROMIUM_SANDBOX: "false"
      # Optional sign-in with Google / Microsoft (docs/OAUTH_SETUP.md). Put the values in a root .env
      # file (git-ignored); the buttons appear only when both values of a provider are set.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT: ${MICROSOFT_TENANT:-common}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      SITE_ADDRESS: ":80"
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
