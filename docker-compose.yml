services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rca
      POSTGRES_PASSWORD: rca
      POSTGRES_DB: rca
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rca -d rca"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://rca:rca@db:5432/rca
      JWT_SECRET: ${JWT_SECRET:-change-me-local-docker-secret}
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8080}
      # Local stack only: demo data. docker-compose.prod.yml never sets these.
      NODE_ENV: development
      SEED_DEMO: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4000/api/v1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
