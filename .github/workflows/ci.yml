name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rca
          POSTGRES_PASSWORD: rca
          POSTGRES_DB: rca
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U rca -d rca" --health-interval 5s --health-timeout 5s --health-retries 20
      s3:
        image: adobe/s3mock:latest
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: rca-test
          initialBuckets: rca-test
        ports: ["9100:9090"]
    env:
      DATABASE_URL: postgresql://rca:rca@localhost:5433/rca
      TEST_DATABASE_URL: postgresql://rca:rca@localhost:5433/rca_test
      E2E_DATABASE_URL: postgresql://rca:rca@localhost:5433/rca_e2e
      S3_TEST_ENDPOINT: http://localhost:9100
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Ubuntu 24.04 runners restrict unprivileged user namespaces (AppArmor), which Chromium's own
      # sandbox needs. Allow them so PDF rendering is tested WITH the sandbox, as in production.
      - name: Allow Chromium sandbox on the runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Lint and type-check
        run: npm run lint
      - name: Unit, API and tenant-isolation tests
        run: npm test
      - name: Tenant-isolation suite (explicit gate)
        run: npx -w @rca/api vitest run test/isolation.test.ts test/tenancy.test.ts
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7

  images:
    runs-on: ubuntu-24.04
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: rca-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web (Caddy) image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: rca-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build backup image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/backup/Dockerfile
          push: false
          tags: rca-backup:ci
